name: Migrate current DexBuilder docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current source docs
        run: |
          git clone --depth 1 --branch main https://github.com/kialison/gtdb.git "$RUNNER_TEMP/source"

      - name: Replace target working tree with source contents
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' "$RUNNER_TEMP/source/" ./

      - name: Commit mirrored docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Migrate DexBuilder docs from kialison/gtdb"
          git push origin HEAD:main
